<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TH05 · 多人 Replay 与观战</title><link rel="icon" href="data:,"><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="site-adapter.css"></head>
<body class="shell"><header class="masthead"><a class="brand" href="lan.html">TOUHOU / 05</a><small>多人 REPLAY / 观战</small></header><main>
<section class="panel"><h1>多人回放／旁观</h1><p>浏览器逐帧提供全员已确认操作。卡顿只延迟播放，不跳过操作；同步帧与原生游戏计数分别校验。模拟器不保存录像。</p>
<label>多人 Replay 文件<input id="file" type="file" accept=".th05m"></label>
<div class="row"><button id="play" disabled>从头播放</button><button id="pause" disabled>暂停播放</button><button id="stop" disabled>停止</button><button id="sound">开启声音</button></div>
<label>点击进度条定位<input id="timeline" type="range" min="0" max="0" value="0" step="1" disabled style="width:100%"></label>
<div class="row"><label>目标同步帧<input id="seek-frame" type="number" min="0" step="1" value="0" style="width:9em"></label><button id="seek" disabled>定位</button><button id="cancel-seek" disabled>取消定位并暂停</button><button id="live-edge" disabled>回到直播</button></div>
<p>Esc／空格暂停观看。正常跟播保持原速；落后时可点击“回到直播”主动追赶。点击定位允许等待：向后会重新开局，逐帧重演到目标；回到直播也需追赶。真人操作不会进入录像。使用来源页面提供的跨设备链接可在另一设备打开；本机旁观链接仅限同浏览器同源页面。</p></section>
<p id="status" role="status" aria-live="polite">导入多人 Replay，或从联机页打开本机旁观。</p><p id="progress"></p>
<canvas id="canvas" width="640" height="400" tabindex="0" aria-label="TH05 多人回放" style="max-width:100%;image-rendering:pixelated"></canvas>
<details><summary>校验详情</summary><pre id="diagnostics"></pre></details>
</main><dialog id="completed"><h2 id="end-title">本段回放结束</h2><p id="end-summary"></p><button id="end-close">关闭提示</button></dialog>
<script type="module" src="coop-replay.js"></script></body></html>
