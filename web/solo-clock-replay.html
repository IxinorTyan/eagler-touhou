<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TH05 · 旧时钟轨迹诊断</title><link rel="icon" href="data:,"><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="site-adapter.css"></head>
<body class="shell"><main><h1>旧时钟轨迹诊断</h1><p>保留用于开发对照。这个旧方案记录启动、菜单和暂停；日常测试请使用 <a href="solo-replay.html">游戏输入 Replay</a>。</p>
<section class="panel"><div class="settings-grid"><label>语言<select id="language"><option value="cn">汉化版</option><option value="jp">日文版</option></select></label><label>导入旧轨迹<input id="file" type="file" accept=".th05r"></label></div>
<div class="row"><button id="record">启动旧诊断</button><button id="finish" disabled>提前结束录制</button><button id="download" disabled>导出轨迹</button><button id="play" disabled>重新启动并回放</button><button id="hold" disabled>暂停播放</button><button id="stop" disabled>关闭模拟器</button></div></section>
<p id="status" role="status">等待启动。</p><canvas id="canvas" width="640" height="400" tabindex="0" style="max-width:100%;image-rendering:pixelated"></canvas><pre id="diagnostics"></pre></main>
<dialog id="save-dialog"><h2>保存旧轨迹？</h2><p id="save-size"></p><button id="save-replay">保存录像</button><button id="discard-replay">不保存</button></dialog>
<script type="module" src="solo-replay.js"></script></body></html>
