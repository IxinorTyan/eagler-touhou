<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TH05 旧格式 Replay 播放</title><link rel="icon" href="data:,"><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="site-adapter.css"></head><body class="shell"><main>
<h1>旧游戏帧 Replay 播放</h1><section class="panel"><label>导入旧格式录像 <input id="file" type="file" accept=".th05r"></label><div class="row"><button id="play" disabled>开始播放</button><button id="hold" disabled>暂停播放</button><button id="stop" disabled>关闭模拟器</button></div><p>旧格式仍由游戏核心重演；剧情按 Z / Enter 推进，Esc / 空格暂停。文件必须匹配资源身份。</p><a href="solo-replay.html">返回浏览器录像播放</a> · <a href="solo.html">录制新录像</a></section>
<div hidden><select id="language"><option value="cn">汉化</option><option value="jp">日文</option></select><select id="test-case"><option value="">正常</option><option value="good">good</option><option value="bad">bad</option><option value="extra">extra</option></select><button id="record"></button><button id="finish"></button><button id="download"></button></div>
<p id="status" role="status">请选择旧游戏帧格式的录像。</p><div id="game-stage"><canvas id="canvas" width="640" height="400" tabindex="0" style="max-width:100%;image-rendering:pixelated"></canvas></div><pre id="diagnostics"></pre>
<dialog id="save-dialog"><p id="save-size"></p><button id="save-replay">保存</button><button id="discard-replay">丢弃</button></dialog><dialog id="end-dialog"><h2 id="end-title"></h2><p id="end-summary"></p><button id="replay-again">再次播放</button><button id="end-replay">结束</button></dialog>
</main><script type="module" src="solo-frame-replay.js"></script></body></html>
