<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TH05 · 多人旁观</title><link rel="icon" href="data:,"><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="site-adapter.css"></head>
<body class="shell"><header class="masthead"><a class="brand" href="lan.html">TOUHOU / 05</a><small>多人旁观</small></header><main>
<section class="panel"><h1>多人旁观</h1><p>观众按帧接收已确认操作。卡顿只延迟播放，不跳过操作；同步帧与原生游戏计数分别校验。</p>
<div class="row"><button id="play" disabled>开始观看</button><button id="pause" disabled>暂停播放</button><button id="stop" disabled>停止旁观</button><button id="sound">开启声音</button></div>
<label>点击进度条定位<input id="timeline" type="range" min="0" max="0" value="0" step="1" disabled style="width:100%"></label>
<div class="row"><label>目标同步帧<input id="seek-frame" type="number" min="0" step="1" value="0" style="width:9em"></label><button id="seek" disabled>定位</button><button id="cancel-seek" disabled>取消定位并暂停</button><button id="live-edge" disabled>回到直播</button></div>
<div class="row"><label>按面定位<select id="stage-select" disabled><option value="">暂无可用面开局</option></select></label></div>
<p>Esc／空格暂停观看。正常跟播保持原速；落后时点击“回到直播”主动追赶。浏览器后台在换面和每 1800 同步帧生成检查点，定位优先从最近检查点恢复，只重演其后的输入。首次生成尚未完成时，仍从开局执行。剧情与原生菜单自动播放，真人操作不会进入游戏。</p><p id="checkpoint-status" role="status"></p></section>
<p id="status" role="status" aria-live="polite">从联机页面打开本机或跨设备旁观链接。</p><p id="progress"></p><p id="cheat-warning" role="status" hidden>本局使用过作弊辅助，历史仅供旁观。</p>
<canvas id="canvas" width="640" height="400" tabindex="0" aria-label="TH05 多人旁观画面" style="max-width:100%;image-rendering:pixelated"></canvas>
<details><summary>校验详情</summary><pre id="diagnostics"></pre></details>
</main><dialog id="completed"><h2 id="end-title">本段旁观结束</h2><p id="end-summary"></p><button id="end-close">关闭提示</button></dialog>
<script type="module" src="coop-replay.js"></script></body></html>
